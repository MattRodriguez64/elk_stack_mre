services:
    nginx:
        image: nginx:latest
        container_name: nginx_container_v5
        ports:
            - "8080:80"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - nginx_logs:/var/log/nginx
            - ./site:/usr/share/nginx/html:ro
    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
        container_name: elasticsearch_container_v5
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
        ports:
            - "9200:9200"
        volumes:
            - elastic_data:/usr/share/elasticsearch/data
    kibana:
        image: docker.elastic.co/kibana/kibana:9.5.4
        container_name: kibana_container_v5
        ports:
            - "5601:5601"
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
        depends_on:
            - elasticsearch
        healthcheck:
            test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
            interval: 10s
            timeout: 5s
            retries: 30
            start_period: 30s
    logstash:
        image: docker.elastic.co/logstash/logstash:9.5.4
        container_name: logstash_container_v5
        ports:
            - "5044:5044"
        depends_on:
            - elasticsearch
            - nginx
        volumes:
            - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro
            # Template de nginx-access-lab : carte des commandes + métriques params.*
            - ./nginx-access-template.json:/usr/share/logstash/templates/nginx-access-template.json:ro
    filebeat:
        image: docker.elastic.co/beats/filebeat:9.5.4
        container_name: filebeat_container_v5
        user: root
        command: ["filebeat", "-e", "--strict.perms=false"]
        volumes:
            - nginx_logs:/var/log/nginx:ro
            - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
        depends_on:
            - nginx
            - logstash
    metricbeat:
        image: docker.elastic.co/beats/metricbeat:9.5.4
        container_name: metricbeat_container_v5
        user: root
        command: ["metricbeat", "-e", "--strict.perms=false"]
        volumes:
            - ./metricbeat.yml:/usr/share/metricbeat/metricbeat.yml:ro
            - /var/run/docker.sock:/var/run/docker.sock:ro
        depends_on:
            - elasticsearch
    kibana-import:
        image: curlimages/curl:latest
        container_name: kibana_import_container_v5
        restart: "no"
        depends_on:
            kibana:
                condition: service_healthy
        volumes:
            - ./dashboard_metric.ndjson:/dashboard_metric.ndjson:ro
        command: >
            curl -sf -X POST "http://kibana:5601/api/saved_objects/_import?overwrite=true"
            -H "kbn-xsrf: true"
            --form file=@/dashboard_metric.ndjson

volumes:
    elastic_data:
    nginx_logs: