input {
    beats {
        port => 5044
    }
}

filter {
    grok {
        match => {"message" => "%{COMBINEDAPACHELOG}"}
    }

    # --- Métriques du site Miam&Go (site/) ---

    # Sépare le chemin et les paramètres de l'URL.
    #   url.path  -> pages les plus vues, endpoints appelés (sans les paramètres)
    #   url.query -> chaîne brute des paramètres
    if [url][original] {
        grok {
            match => { "[url][original]" => "^%{URIPATH:[url][path]}(?:\?%{GREEDYDATA:[url][query]})?$" }
            tag_on_failure => ["_url_split_failure"]
        }
    }

    # Découpe les paramètres d'URL en champs params.* :
    #   params.sid                   -> visiteurs uniques, taux de conversion par session
    #   params.page / params.duree   -> temps passé par page (api/tracking/page.json)
    #   params.resto                 -> restaurants préférés (vues, ajouts, commandes)
    #   params.plat / prix / qte     -> plats préférés (api/panier/ajout.json)
    #   params.q / cat / tri         -> recherches et filtres de la page d'accueil
    #   params.raison                -> paniers vidés (changement de restaurant, manuel...)
    #   params.paiement / zone / creneau / pourboire / promo -> habitudes de commande
    #   params.total / sous_total / articles -> panier moyen, chiffre d'affaires
    #   params.etape                 -> suivi et annulations de commande
    #   params.note                  -> note moyenne par restaurant
    if [url][query] {
        kv {
            source => "[url][query]"
            target => "params"
            field_split => "&"
            value_split => "="
        }
        # Décode les valeurs encodées par le navigateur (+ -> espace, puis %2F -> /, %C3%89 -> É).
        mutate {
            gsub => [
                "[params][q]", "\+", " ",
                "[params][ville]", "\+", " ",
                "[params][pays]", "\+", " "
            ]
        }
        if [params][q] {
            urldecode { field => "[params][q]" }
        }
        if [params][page] {
            urldecode { field => "[params][page]" }
        }
        # params.ville / params.pays -> comparaison des établissements par ville et par pays
        if [params][ville] {
            urldecode { field => "[params][ville]" }
        }
        if [params][pays] {
            urldecode { field => "[params][pays]" }
        }

        # Localisation de l'établissement qui reçoit la commande.
        #   client.geo.location     -> carte Kibana Maps (geo_point, voir nginx-access-template.json)
        #   client.geo.city_name    -> ville de l'établissement
        #   client.geo.country_name -> pays de l'établissement
        if [params][lat] and [params][lon] {
            mutate {
                add_field => {
                    "[client][geo][location]" => "%{[params][lat]},%{[params][lon]}"
                    "[client][geo][city_name]" => "%{[params][ville]}"
                    "[client][geo][country_name]" => "%{[params][pays]}"
                }
            }
        }

        # Types numériques pour pouvoir faire des moyennes et des sommes.
        mutate {
            convert => {
                "[params][duree]" => "integer"
                "[params][prix]" => "float"
                "[params][qte]" => "integer"
                "[params][articles]" => "integer"
                "[params][sous_total]" => "float"
                "[params][total]" => "float"
                "[params][lat]" => "float"
                "[params][lon]" => "float"
                "[params][pourboire]" => "float"
                "[params][note]" => "integer"
            }
        }
    }
}

output {
    stdout {codec => rubydebug}
    elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "nginx-access-lab"
        # Template de l'index : geo_point pour la carte, types numériques pour params.*
        template => "/usr/share/logstash/templates/nginx-access-template.json"
        template_name => "nginx-access-lab"
        template_overwrite => true
    }
}
