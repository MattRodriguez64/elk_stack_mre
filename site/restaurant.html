<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant — Miam&amp;Go</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">🛵 Miam&amp;Go</a>
    <nav>
      <a href="/">Restaurants</a>
      <a href="/panier.html">🛒 Panier <span class="badge" data-cart-count hidden>0</span></a>
    </nav>
  </header>

  <main class="container" id="page">
    <p class="meta">Chargement…</p>
  </main>

  <a class="cart-bar" id="cart-bar" href="/panier.html" hidden>
    <span id="cart-bar-count"></span>
    <span id="cart-bar-total"></span>
  </a>

  <footer>Miam&amp;Go — site de démonstration pour le lab ELK</footer>

  <script src="/assets/app.js"></script>
  <script>
    const id = Shop.param('id');
    const page = document.getElementById('page');

    Promise.all([Shop.restaurant(id), Shop.menu(id)]).then(([resto, plats]) => {
      document.title = resto.nom + ' — Miam&Go';

      function render() {
        const cart = Shop.cart();
        const mine = cart.resto === resto.id ? cart.items : {};
        const sections = [...new Set(plats.map(p => p.section))];

        page.innerHTML =
          '<p><a href="/">← Tous les restaurants</a></p>' +
          '<div class="resto-head"><div class="resto-emoji">' + resto.emoji + '</div><div>' +
            '<h1>' + Shop.esc(resto.nom) + '</h1>' +
            '<div class="meta">📍 ' + Shop.esc(resto.ville) + ', ' + Shop.esc(resto.pays) + '</div>' +
            '<div class="meta">⭐ ' + resto.note + ' · ' + resto.delai + ' min · livraison ' + Shop.euro(resto.frais) +
            ' · minimum ' + Shop.euro(resto.minimum) + '</div>' +
          '</div></div>' +
          sections.map(s =>
            '<h2 class="section-title">' + Shop.esc(s) + '</h2><div class="grid">' +
            plats.filter(p => p.section === s).map(p => {
              const qte = mine[p.id] || 0;
              return '<div class="card dish"><div>' +
                  '<h3>' + Shop.esc(p.nom) + '</h3><p>' + Shop.esc(p.desc) + '</p>' +
                  '<span class="price">' + Shop.euro(p.prix) + '</span>' +
                '</div><div class="dish-actions">' +
                  (qte
                    ? '<span class="qty"><button data-remove="' + p.id + '" aria-label="Retirer">−</button>' + qte +
                      '<button data-add="' + p.id + '" aria-label="Ajouter">+</button></span>'
                    : '<button class="btn small" data-add="' + p.id + '">Ajouter</button>') +
                '</div></div>';
            }).join('') + '</div>').join('');

        const n = cart.resto === resto.id ? Shop.count(cart) : 0;
        const bar = document.getElementById('cart-bar');
        bar.hidden = n === 0;
        if (n) {
          const t = Shop.totals(cart, resto, plats);
          document.getElementById('cart-bar-count').textContent = 'Voir le panier (' + n + ')';
          document.getElementById('cart-bar-total').textContent = Shop.euro(t.sousTotal);
        }
      }

      page.addEventListener('click', e => {
        const addId = e.target.dataset.add;
        const removeId = e.target.dataset.remove;
        if (addId) Shop.add(resto, plats.find(p => p.id === addId));
        if (removeId) Shop.remove(removeId);
        if (addId || removeId) render();
      });

      render();
    }).catch(() => {
      page.innerHTML = '<div class="empty"><div class="big">🍽️</div><p>Ce restaurant est introuvable.</p><a class="btn" href="/">Retour aux restaurants</a></div>';
    });
  </script>
</body>
</html>
