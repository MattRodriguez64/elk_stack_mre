<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panier — Miam&amp;Go</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">🛵 Miam&amp;Go</a>
    <nav>
      <a href="/">Restaurants</a>
      <a href="/panier.html">🛒 Panier <span class="badge" data-cart-count hidden>0</span></a>
    </nav>
  </header>

  <main class="container" id="page">
    <p class="meta">Chargement…</p>
  </main>

  <footer>Miam&amp;Go — site de démonstration pour le lab ELK</footer>

  <script src="/assets/app.js"></script>
  <script>
    const page = document.getElementById('page');
    const emptyHtml = '<div class="empty"><div class="big">🛒</div><p>Votre panier est vide.</p><a class="btn" href="/">Découvrir les restaurants</a></div>';
    let promoMessage = '';

    function load() {
      const cart = Shop.cart();
      if (!cart.resto || !Shop.count(cart)) { page.innerHTML = emptyHtml; return; }
      Promise.all([Shop.restaurant(cart.resto), Shop.menu(cart.resto)])
        .then(([resto, plats]) => render(resto, plats))
        .catch(() => { Shop.clearCart('restaurant_indisponible'); page.innerHTML = emptyHtml; });
    }

    function render(resto, plats) {
      const cart = Shop.cart();
      if (!Shop.count(cart)) { page.innerHTML = emptyHtml; return; }
      const t = Shop.totals(cart, resto, plats);

      let promoInfo = promoMessage;
      if (cart.promo && !t.promoOk) {
        promoInfo = '<div class="notice warn">Code ' + Shop.esc(cart.promo.code) + ' : minimum de ' + Shop.euro(cart.promo.minimum) + ' non atteint.</div>';
      } else if (cart.promo) {
        promoInfo = '<div class="notice ok">Code ' + Shop.esc(cart.promo.code) + ' appliqué : ' + Shop.esc(cart.promo.libelle) +
          ' <button class="btn small secondary" id="promo-remove">Retirer</button></div>';
      }

      page.innerHTML =
        '<h1>Votre panier</h1>' +
        '<div class="layout"><div class="card">' +
          '<h2>' + resto.emoji + ' <a href="/restaurant.html?id=' + encodeURIComponent(resto.id) + '">' + Shop.esc(resto.nom) + '</a></h2>' +
          t.lignes.map(l =>
            '<div class="line"><div><strong>' + Shop.esc(l.plat.nom) + '</strong><div class="meta">' + Shop.euro(l.plat.prix) + '</div></div>' +
            '<span class="qty"><button data-remove="' + l.plat.id + '" aria-label="Retirer">−</button>' + l.qte +
            '<button data-add="' + l.plat.id + '" aria-label="Ajouter">+</button></span>' +
            '<strong>' + Shop.euro(l.total) + '</strong></div>').join('') +
          '<p><a href="/restaurant.html?id=' + encodeURIComponent(resto.id) + '">+ Ajouter d\'autres plats</a></p>' +
          '<button class="btn danger small" id="clear">Vider le panier</button>' +
        '</div><div class="card">' +
          '<h2>Récapitulatif</h2>' +
          Shop.totalsHtml(t, cart) +
          '<form class="promo" id="promo-form"><input name="code" placeholder="Code promo" autocomplete="off"><button class="btn secondary">Appliquer</button></form>' +
          promoInfo +
          (t.minimumAtteint ? '' : '<div class="notice warn">Minimum de commande : ' + Shop.euro(resto.minimum) + '. Encore ' + Shop.euro(resto.minimum - t.sousTotal) + ' !</div>') +
          '<button class="btn" id="checkout" style="width:100%"' + (t.minimumAtteint ? '' : ' disabled') + '>Commander · ' + Shop.euro(t.total) + '</button>' +
        '</div></div>';

      page.querySelectorAll('[data-add]').forEach(b => b.onclick = () => {
        Shop.add(resto, plats.find(p => p.id === b.dataset.add)); render(resto, plats);
      });
      page.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => {
        Shop.remove(b.dataset.remove); render(resto, plats);
      });
      document.getElementById('clear').onclick = () => {
        if (confirm('Vider le panier ?')) { Shop.clearCart('manuel'); page.innerHTML = emptyHtml; }
      };
      document.getElementById('checkout').onclick = () => { location.href = '/commande.html'; };

      const removeBtn = document.getElementById('promo-remove');
      if (removeBtn) removeBtn.onclick = () => { Shop.setPromo(null); promoMessage = ''; render(resto, plats); };

      document.getElementById('promo-form').onsubmit = e => {
        e.preventDefault();
        const code = e.target.code.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        if (!code) return;
        // Un code inconnu n'a pas de fichier : nginx répond 404.
        Shop.api('promo/' + code + '.json', { resto: resto.id, sous_total: t.sousTotal.toFixed(2) })
          .then(r => r.ok ? r.json() : null)
          .then(promo => {
            if (promo) { Shop.setPromo(promo); promoMessage = ''; }
            else promoMessage = '<div class="notice err">Le code « ' + Shop.esc(code) + ' » n\'est pas valide.</div>';
            render(resto, plats);
          });
      };
    }

    load();
  </script>
</body>
</html>
