<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suivi de commande — Miam&amp;Go</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/">🛵 Miam&amp;Go</a>
    <nav>
      <a href="/">Restaurants</a>
      <a href="/panier.html">🛒 Panier <span class="badge" data-cart-count hidden>0</span></a>
    </nav>
  </header>

  <main class="container" id="page"></main>

  <footer>Miam&amp;Go — site de démonstration pour le lab ELK</footer>

  <script src="/assets/app.js"></script>
  <script>
    const page = document.getElementById('page');
    const id = Shop.param('commande');
    const order = Shop.lastOrder();

    if (!id || !order || order.id !== id) {
      page.innerHTML = '<div class="empty"><div class="big">📦</div><p>Commande introuvable.</p><a class="btn" href="/">Retour à l\'accueil</a></div>';
    } else {
      // Progression accélérée pour le lab : une étape toutes les 5 secondes.
      const STEPS = [
        ['acceptee', 'Commande acceptée par le restaurant'],
        ['preparation', 'En préparation'],
        ['en_route', 'Le livreur est en route'],
        ['livree', 'Livrée — bon appétit !'],
      ];
      const STEP_MS = 5000;
      let current = 0;
      let timer = null;

      page.innerHTML =
        '<div class="card" style="max-width:560px;margin:0 auto">' +
          '<h1>Merci pour votre commande !</h1>' +
          '<p class="meta">N° ' + Shop.esc(order.id) + ' · ' + order.emoji + ' ' + Shop.esc(order.nom) + ' · ' + Shop.euro(order.total) + '</p>' +
          '<ol class="steps" id="steps"></ol>' +
          '<div id="actions"></div>' +
        '</div>';

      function renderSteps() {
        document.getElementById('steps').innerHTML = STEPS.map(([, label], i) =>
          '<li class="' + (i < current ? 'done' : i === current ? 'current' : '') + '"><span class="dot"></span>' + label + '</li>').join('');
      }

      function track() {
        Shop.api('commande/suivi.json', { commande: order.id, resto: order.resto, etape: STEPS[current][0] });
        renderSteps();
        const actions = document.getElementById('actions');
        if (current < 2) {
          actions.innerHTML = '<button class="btn danger" id="cancel">Annuler la commande</button>';
          document.getElementById('cancel').onclick = cancel;
        } else if (current === STEPS.length - 1) {
          showRating(actions);
        } else {
          actions.innerHTML = '<p class="meta">Arrivée estimée dans quelques minutes…</p>';
        }
        if (current < STEPS.length - 1) {
          timer = setTimeout(() => { current += 1; track(); }, STEP_MS);
        }
      }

      function cancel() {
        if (!confirm('Annuler cette commande ?')) return;
        clearTimeout(timer);
        Shop.api('commande/annulation.json', { commande: order.id, resto: order.resto, etape: STEPS[current][0] });
        document.getElementById('steps').innerHTML = '<li class="current"><span class="dot"></span>Commande annulée — vous serez remboursé.</li>';
        document.getElementById('actions').innerHTML = '<a class="btn" href="/">Retour aux restaurants</a>';
      }

      function showRating(actions) {
        actions.innerHTML =
          '<h2>Comment était votre repas ?</h2>' +
          '<div class="stars" id="stars">' + [1, 2, 3, 4, 5].map(n => '<button data-note="' + n + '" aria-label="' + n + ' étoile(s)">★</button>').join('') + '</div>' +
          '<p><a href="/restaurant.html?id=' + encodeURIComponent(order.resto) + '">Commander à nouveau chez ' + Shop.esc(order.nom) + '</a> · <a href="/">Autres restaurants</a></p>';
        document.getElementById('stars').onclick = e => {
          const note = Number(e.target.dataset.note);
          if (!note) return;
          Shop.api('commande/avis.json', { commande: order.id, resto: order.resto, note });
          document.querySelectorAll('#stars button').forEach(b => b.classList.toggle('on', Number(b.dataset.note) <= note));
          document.getElementById('stars').insertAdjacentHTML('afterend', '<p class="notice ok">Merci pour votre avis !</p>');
          document.getElementById('stars').onclick = null;
        };
      }

      track();
    }
  </script>
</body>
</html>
